<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e9e5dd">
    <title>Stratacutoscope</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <main class="viewer" aria-label="Interactive 3D model viewer">
      <canvas id="scene" aria-label="3D model. Drag to rotate."></canvas>
      <div class="status" id="status" role="status" aria-live="polite" aria-label="Loading" data-loading="true">
        <span class="status-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>
        <span class="status-text"></span>
      </div>
      <div class="footer">
        <div class="actions">
          <button id="motion" type="button" aria-pressed="true" aria-label="Pause rotation" title="Pause rotation" data-playing="true">
            <svg class="icon icon-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="3" y="2" width="3.5" height="12" rx="0.75" />
              <rect x="9.5" y="2" width="3.5" height="12" rx="0.75" />
            </svg>
            <svg class="icon icon-play" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M4 2.5v11a0.75 0.75 0 0 0 1.13 0.65l9-5.5a0.75 0.75 0 0 0 0-1.3l-9-5.5A0.75 0.75 0 0 0 4 2.5z" />
            </svg>
          </button>
          <button id="gyroscope" type="button" aria-pressed="false" aria-label="Toggle gyroscope rotation" hidden>Gyroscope off</button>
          <span class="sound-wrap">
          <button id="sound" type="button" aria-pressed="false" aria-label="Turn sound on" title="Turn sound on" data-sound="false" data-loading="true" aria-busy="true" disabled>
            <svg class="icon icon-loading" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="26 9" stroke-linecap="round" />
            </svg>
            <svg class="icon icon-sound-off" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M2 5.5h2.5L8.5 2.5v11l-4-3H2z" />
              <path d="M11 6l3.5 4M14.5 6L11 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <svg class="icon icon-sound-on" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M2 5.5h2.5L8.5 2.5v11l-4-3H2z" />
              <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <div class="sound-tip" id="sound-tip" role="status">Tap for sound</div>
          </span>
          <button id="tweak-toggle" type="button" aria-label="Stone settings" aria-pressed="false" hidden>Stone</button>
          <button id="about-toggle" type="button" aria-label="About this project" aria-expanded="false">
            <span class="when-closed">?</span>
            <span class="when-open" aria-hidden="true">✕</span>
          </button>
        </div>
      </div>
      <div class="about-overlay" id="about-overlay" role="dialog" aria-modal="true" aria-label="About Stratacutoscope" tabindex="-1" hidden>
        <div style="opacity: .9;" class="about-content">
          <p><img src="./stratacutoscope.gif" /><br>
          <p>All 3D models made by <a style="color:white;" href="https://www.sanderjoon.com" target="_blank"><b>Sander Joon</b></a> in Blender.</p>
          <div class="touch-only">
            <dl class="hints">
              <div><dt>Drag</dt><span class="leader" aria-hidden="true"></span><dd>rotate</dd></div>
              <div><dt>Pinch</dt><span class="leader" aria-hidden="true"></span><dd>zoom and cut deeper</dd></div>
            </dl>
          </div>
          <div class="mouse-only">
            <dl class="hints">
              <div><dt>Drag</dt><span class="leader" aria-hidden="true"></span><dd>rotate</dd></div>
              <div><dt>Scroll</dt><span class="leader" aria-hidden="true"></span><dd>zoom and cut deeper</dd></div>
            </dl>
          </div>
          <p><small style="opacity: 50%; font-style: italic;">Please reach out to <a style="color:white;" href="mailto:sander.joon@gmail.com"><b>sander.joon@gmail.com</b></a> if you have any suggestions<i>!</i></small></p>
        </div>
      </div>
      <nav class="model-navigation" aria-label="Model selection">
        <div class="model-picker">
          <button id="model-picker-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="model-picker-menu" disabled></button>
          <div class="model-picker-menu" id="model-picker-menu" role="menu" aria-label="Choose a model" hidden></div>
        </div>
        <div class="model-navigation-buttons">
          <button id="previous-model" type="button" aria-label="Previous model" disabled>&lt; Prev</button>
          <button id="gallery-toggle" type="button" aria-pressed="false" aria-label="Show all models" title="Show all models" disabled>All</button>
          <button id="next-model" type="button" aria-label="Next model" disabled>Next &gt;</button>
        </div>
      </nav>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
